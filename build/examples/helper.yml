# /etc/host-health-mcp/helper.yml - example
# Root-only, mode 0600.

daemon_user: host-health-mcp
socket_path: /run/host-health-mcp/helper.sock

# Per-op deadline overrides (milliseconds). Missing keys use the
# built-in default of 9500 ms, which is the daemon's 10 s per-tool cap
# (REQ 5.1) less the 500 ms the helper needs to escalate SIGTERM to
# SIGKILL on a subprocess that ignores the first signal.
#
# The daemon also sends its own remaining budget with each request.
# The effective deadline is the smaller of the two, so an override
# longer than the calling tool's timeout has no effect: it raises the
# ceiling, it does not extend any individual call. Values are clamped
# to [250 ms, 15 s]; 0 or negative falls back to the default.
#
# Lower a value when a tool should give up sooner than the daemon
# would. Raising one only matters alongside a matching
# timeout_overrides entry in daemon.yml.
op_deadline_ms:
  smart_summary: 8000
  zpool_status: 5000

# Which paths nginx_apache_status may read as an access log. The path
# itself arrives in the request from the daemon, so the allow-list that
# bounds it belongs here on the privileged side — the helper exists to
# be separate from the network-facing half.
#
# Empty or absent keeps the built-in default of /var/log/. An empty
# list does NOT mean "allow everything"; there is no such setting.
access_log_prefixes:
  - /var/log/
