# /etc/host-health-mcp/manifest.yml - example
# Per-host tool enablement plus tool-specific operator-supplied data.

enabled_tools:
  - manifest
  - system
  - systemd_units
  - network
  - dns
  - security
  - certs
  - mail
  - backup
  - logs
  - updates
  - storage
  - kernel
  - pressure
  - sockets
  # - sensors    # uncomment on hosts with hwmon-capable hardware
  # - workload   # uncomment if any workload plugin is configured

# Tool 4.2 - units the daemon reports on. No free-form unit name from
# the caller; the daemon will only return state for units in this list.
whitelisted_units:
  - sshd.service
  - cron.service
  - systemd-timesyncd.service
  - host-health-mcp.service
  - host-health-mcp-helper.service

# Tool 4.9 - selects compile-time workload plugins. The actual plugin
# code must be linked into the daemon at build (build tags); listing
# a plugin here that is not compiled in is a startup error (REQ 8.2).
workload_plugins: []

# Per-plugin configuration. Only the keys recognised by each plugin
# are consumed; unknown keys produce a startup warning.
# workload_plugin_config:
#   nginx_apache:
#     access_log_path: /var/log/nginx/access.log
#     # access_log_window_minutes: 60
#     # access_log_tail_bytes: 262144

# Tool 4.6 - certificate paths and their renewal units.
cert_paths: []
cert_renewal_units: []

# Tool 4.8. backup_backend is one of borg, borgmatic, restic,
# rsnapshot, duplicity, or none.
#
# Source precedence (highest first):
#   1. backup_state_path (default /var/lib/host-health-mcp/backup-state.json).
#      The operator's backup wrapper writes a small JSON with the four
#      fields the tool returns (last_start_ts, last_end_ts,
#      last_exit_code, last_archive_label). Backend-agnostic; no
#      passphrase ever enters the daemon. Recommended.
#   2. backup_log_path. mtime of the log file gives last_end_ts; the
#      other fields stay null.
#   3. Auto-probe of well-known log paths by backend if backup_log_path
#      is null. Always emits a warning naming the probed paths.
backup_log_path: null
backup_state_path: null    # null falls back to /var/lib/host-health-mcp/backup-state.json
backup_backend: none

# Tool 4.5 debsums sub-field. Set to the path of the operator's
# debsums log (typically /var/log/debsums.log from a cron wrapper).
# When null and debsums is installed the tool falls back to the
# `debsums-check.timer`'s LastTriggerUSec for last_run_ts only; if
# neither is available a warning is surfaced rather than silently
# returning null fields.
debsums_log_path: null

# Tool 4.5 AIDE sub-field. Set to the path of the operator's AIDE
# log if the cron wrapper writes one (e.g. /var/log/aide-check.log).
# The daemon parses 'AIDE found differences' / 'AIDE found NO
# differences' for last_exit_code, and 'Total number of differences:'
# or 'Added/Removed/Changed entries:' for change_count. Null leaves
# the helper's AIDE-DB mtime lookup as the only source (no
# change_count, no exit code).
aide_log_path: null

# Tool 4.3 - one of required-off / required-on / not-enforced.
ipv6_policy: not-enforced

# Tool 4.13 (btrfs_scrub) - the helper validates a caller-supplied
# mountpoint via statfs(2) f_type == BTRFS_SUPER_MAGIC AND against
# this list before invoking `btrfs scrub status`.
btrfs_mountpoints: []
