# /etc/host-health-mcp/daemon.yml - example
# See doc/design-overview.md and doc/REQUIREMENTS.txt section 8.1.

bind_addr: "127.0.0.1:8443"

tls_cert_path: /etc/host-health-mcp/tls/cert.pem
tls_key_path:  /etc/host-health-mcp/tls/key.pem
client_ca_path: /etc/host-health-mcp/tls/ca.pem

manifest_path: /etc/host-health-mcp/manifest.yml
# Optional. Extra regexps applied on top of the built-in redaction, for
# anything the positive list keeps by design (email addresses being the
# usual case). See examples/redaction.yml.
#
# Commented out deliberately: naming a path here requires the file to
# exist. If you want operator rules, copy examples/redaction.yml into
# /etc/host-health-mcp/ first, then uncomment.
# log_redaction_rules: /etc/host-health-mcp/redaction.yml

helper_socket_path: /run/host-health-mcp/helper.sock

# Per-tool cache TTL overrides (seconds). Tool defaults apply when absent.
cache_ttl_overrides:
  logs: 60
  storage: 60

# Per-tool timeout overrides (seconds). REQ 5.1: ceiling 10s.
#
# Note (1.12.0 helper deadline budget): the daemon now sets the
# helper-socket deadline 500ms earlier than the per-tool timeout so
# the helper has room to SIGTERM->SIGKILL its subprocess and still
# drain a reply before the daemon's ctx fires. This shaves 500ms off
# the effective tool execution budget; bump these by 500ms relative
# to pre-1.12.0 values if you were tuned at the margin.
timeout_overrides:
  storage: 11   # was 10; +500ms budget after 1.12.0
  logs:     6   # was 5;  +500ms budget after 1.12.0
  updates:  9   # was 8;  +500ms budget after 1.12.0

# DNS probes for tool 4.4. Operator-supplied; caller cannot influence.
dns_probe_targets:
  self_hostname: ""               # filled at start from /etc/hostname
  external_probe: example.com
  filter_canary: dnscanary.org

# Sensitive directories consulted by REQ 6.2/6.3.
sensitive_dirs:
  - /etc/host-health-mcp
  - /etc/ssh
  - /root

# CIDRs allowed through the redaction filter for log samples.
ipv4_allowlist_ranges:
  - 10.0.0.0/8
  - 192.168.0.0/16
ipv6_allowlist_ranges:
  - fc00::/7

# Set true if bind_addr is on a public interface; the daemon emits a
# startup warning unless this is explicit (REQ 6.4).
public_bind_acknowledged: false

# Per-(caller, tool) buckets for expensive tools. The per-caller global
# bucket (30 req/min sustained, burst 10) applies on top.
expensive_tool_buckets:
  logs:     { sustained_per_min: 10, burst: 3 }
  workload: { sustained_per_min: 10, burst: 3 }
  storage:  { sustained_per_min: 10, burst: 3 }

# TLS handshake concurrency ceiling (design 8). Default 16.
max_concurrent_handshakes: 16

# Kernel-level IP filter for the daemon unit (REQ 6.8). Consumed at
# install time by host-health-mcp-caps-template, which turns it into
# IPAddressAllow= lines in
# /etc/systemd/system/host-health-mcp.service.d/10-ip-filter.conf.
# Re-run the generator after changing it.
#
# systemd's IPAddressAllow=/IPAddressDeny= filter packets in BOTH
# directions. This list must therefore name every network that has to
# reach the listener as well as every egress destination the daemon is
# allowed to contact — a list containing only resolvers will make the
# daemon unreachable. Leave it out entirely (the default) and no
# drop-in is generated.
#
# Block form only, one entry per line. The generator rejects flow form
# (ip_filter_allow: [a, b]) rather than silently producing an empty
# filter from a non-empty config.
#
# ip_filter_allow:
#   - localhost                  # loopback, and systemd-resolved
#   - 10.0.0.0/8                 # operator workstations and resolvers
#   - 192.0.2.10                 # a single external resolver
